<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Deep Forensic & Cyber Twilight Sky Gradient -->
    <linearGradient id="nsitSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="80%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="nsitHorizonGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nsitBuildingMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="nsitHeritageAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="nsitCyberGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="nsitLawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
  </defs>

  <!-- Sky & Cyber/Academic Horizon Glow -->
  <rect width="1200" height="675" fill="url(#nsitSky)" />
  <rect width="1200" height="675" fill="url(#nsitHorizonGlow)" />

  <!-- Subtle Digital & Forensic Blueprint Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Left Wing: Forensic Science & Crime Scene Investigation Block -->
  <rect x="65" y="285" width="275" height="235" rx="6" fill="url(#nsitBuildingMain)" stroke="#94A3B8" stroke-width="2" />
  <rect x="65" y="285" width="275" height="28" fill="url(#nsitHeritageAccent)" />
  <text x="202" y="304" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11.5" fill="#FEF3C7" letter-spacing="2">FORENSIC SCIENCES WING</text>
  <g fill="url(#nsitCyberGlass)" stroke="#F59E0B" stroke-width="1.2">
    <rect x="88" y="332" width="62" height="46" rx="4" />
    <rect x="170" y="332" width="62" height="46" rx="4" />
    <rect x="252" y="332" width="62" height="46" rx="4" />
    <rect x="88" y="396" width="62" height="46" rx="4" />
    <rect x="170" y="396" width="62" height="46" rx="4" />
    <rect x="252" y="396" width="62" height="46" rx="4" />
  </g>

  <!-- Right Wing: Cyber Security & Digital Forensics (DFIS) Innovation Block -->
  <rect x="860" y="285" width="275" height="235" rx="6" fill="url(#nsitBuildingMain)" stroke="#94A3B8" stroke-width="2" />
  <rect x="860" y="285" width="275" height="28" fill="#1E3A8A" />
  <text x="997" y="304" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11.5" fill="#38BDF8" letter-spacing="2">CYBER SECURITY &amp; DFIS LABS</text>
  <g fill="url(#nsitCyberGlass)" stroke="#38BDF8" stroke-width="1.2">
    <rect x="884" y="332" width="62" height="46" rx="4" />
    <rect x="966" y="332" width="62" height="46" rx="4" />
    <rect x="1048" y="332" width="62" height="46" rx="4" />
    <rect x="884" y="396" width="62" height="46" rx="4" />
    <rect x="966" y="396" width="62" height="46" rx="4" />
    <rect x="1048" y="396" width="62" height="46" rx="4" />
  </g>

  <!-- Central NSIT-IFSCS Main Campus Building (Jetalpur, Ahmedabad) -->
  <!-- Heritage Gurukul Dome & Modern Academic Crown -->
  <path d="M 480 232 C 480 135, 720 135, 720 232 Z" fill="url(#nsitHeritageAccent)" stroke="#FDE68A" stroke-width="3" />
  <circle cx="600" cy="140" r="10" fill="#FDE68A" />
  <line x1="600" y1="102" x2="600" y2="140" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" />

  <!-- Main Central Academic Facade -->
  <rect x="315" y="232" width="570" height="288" rx="4" fill="url(#nsitBuildingMain)" stroke="#CBD5E1" stroke-width="2.5" />
  <!-- Royal Navy & Gold Institutional Fascia Board -->
  <rect x="315" y="232" width="570" height="46" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
  <text x="600" y="253" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14.5" fill="#FDE68A" letter-spacing="2.2">NARNARAYAN SHASTRI INSTITUTE OF TECHNOLOGY</text>
  <text x="600" y="270" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11" fill="#38BDF8" letter-spacing="2.5">INSTITUTE OF FORENSIC SCIENCES &amp; CYBER SECURITY (NSIT-IFSCS)</text>

  <!-- Panoramic Glass Curtain Wall & Architectural Columns -->
  <rect x="348" y="298" width="140" height="150" rx="6" fill="url(#nsitCyberGlass)" stroke="#38BDF8" stroke-width="1.5" />
  <rect x="712" y="298" width="140" height="150" rx="6" fill="url(#nsitCyberGlass)" stroke="#38BDF8" stroke-width="1.5" />
  <!-- Window Mullions -->
  <g stroke="#E0F2FE" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="395" y1="298" x2="395" y2="448" />
    <line x1="442" y1="298" x2="442" y2="448" />
    <line x1="348" y1="348" x2="488" y2="348" />
    <line x1="348" y1="398" x2="488" y2="398" />

    <line x1="759" y1="298" x2="759" y2="448" />
    <line x1="806" y1="298" x2="806" y2="448" />
    <line x1="712" y1="348" x2="852" y2="348" />
    <line x1="712" y1="398" x2="852" y2="398" />
  </g>

  <!-- Central Grand Entrance Atrium & Arch -->
  <rect x="508" y="290" width="184" height="230" fill="#FFFFFF" stroke="#D97706" stroke-width="2" />
  <path d="M 536 520 L 536 382 A 64 64 0 0 1 664 382 L 664 520 Z" fill="#0F172A" stroke="#F59E0B" stroke-width="3" />
  <path d="M 548 520 L 548 386 A 52 52 0 0 1 652 386 L 652 520 Z" fill="url(#nsitCyberGlass)" />
  <text x="600" y="314" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#1E3A8A" letter-spacing="1.8">AFFILIATED TO NFSU</text>

  <!-- Campus Forecourt, Lawns & Avenue -->
  <rect x="0" y="520" width="1200" height="155" fill="url(#nsitLawn)" />
  <polygon points="505,520 695,520 845,675 355,675" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2" />
  <line x1="600" y1="530" x2="600" y2="675" stroke="#F59E0B" stroke-width="3" stroke-dasharray="14 10" />

  <!-- Campus Trees & Greenery -->
  <g fill="#047857" stroke="#064E3B" stroke-width="2">
    <circle cx="290" cy="502" r="34" />
    <circle cx="250" cy="510" r="28" fill="#059669" />
    <circle cx="910" cy="502" r="34" />
    <circle cx="950" cy="510" r="28" fill="#059669" />
  </g>
</svg>
