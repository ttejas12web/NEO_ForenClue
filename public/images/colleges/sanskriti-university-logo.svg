<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="suShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E24" />
      <stop offset="50%" stop-color="#6B1117" />
      <stop offset="100%" stop-color="#4A0A0E" />
    </linearGradient>
    <linearGradient id="suGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="suSunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <radialGradient id="suBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </radialGradient>
  </defs>

  <!-- Clean Institutional Seal Backdrop -->
  <rect width="400" height="400" rx="64" fill="url(#suBgGlow)" />
  <circle cx="200" cy="200" r="176" fill="#FFFFFF" stroke="url(#suGoldGrad)" stroke-width="8" />
  <circle cx="200" cy="200" r="162" fill="none" stroke="#8B1E24" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- Outer Gold Laurel Wreath -->
  <g stroke="url(#suGoldGrad)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 92 260 C 64 200, 82 120, 140 84" />
    <path d="M 308 260 C 336 200, 318 120, 260 84" />
  </g>
  <!-- Laurel Leaves Left & Right -->
  <g fill="url(#suGoldGrad)">
    <ellipse cx="82" cy="230" rx="10" ry="5" transform="rotate(-35 82 230)" />
    <ellipse cx="76" cy="195" rx="10" ry="5" transform="rotate(-15 76 195)" />
    <ellipse cx="82" cy="160" rx="10" ry="5" transform="rotate(10 82 160)" />
    <ellipse cx="98" cy="128" rx="10" ry="5" transform="rotate(30 98 128)" />
    <ellipse cx="120" cy="102" rx="10" ry="5" transform="rotate(45 120 102)" />

    <ellipse cx="318" cy="230" rx="10" ry="5" transform="rotate(35 318 230)" />
    <ellipse cx="324" cy="195" rx="10" ry="5" transform="rotate(15 324 195)" />
    <ellipse cx="318" cy="160" rx="10" ry="5" transform="rotate(-10 318 160)" />
    <ellipse cx="302" cy="128" rx="10" ry="5" transform="rotate(-30 302 128)" />
    <ellipse cx="280" cy="102" rx="10" ry="5" transform="rotate(-45 280 102)" />
  </g>

  <!-- Central Royal Maroon Crest Shield -->
  <path d="M 118 104 L 282 104 L 282 198 C 282 256, 200 296, 200 296 C 200 296, 118 256, 118 198 Z" fill="url(#suShieldGrad)" stroke="url(#suGoldGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Rising Sun of Knowledge inside Shield -->
  <circle cx="200" cy="166" r="28" fill="url(#suSunGrad)" />
  <g stroke="#FDE68A" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="124" x2="200" y2="132" />
    <line x1="170" y1="136" x2="176" y2="142" />
    <line x1="230" y1="136" x2="224" y2="142" />
    <line x1="156" y1="164" x2="164" y2="164" />
    <line x1="244" y1="164" x2="236" y2="164" />
  </g>

  <!-- Open Book & Lotus Petals -->
  <path d="M 146 218 Q 173 204 200 218 Q 227 204 254 218 L 254 186 Q 227 172 200 186 Q 173 172 146 186 Z" fill="#FFFFFF" stroke="url(#suGoldGrad)" stroke-width="3" />
  <line x1="200" y1="186" x2="200" y2="218" stroke="#8B1E24" stroke-width="2.5" />

  <!-- Bold Monogram SU -->
  <text x="200" y="266" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="34" fill="#FDE68A" letter-spacing="3">SU</text>

  <!-- Bottom Ribbon Banner -->
  <path d="M 68 312 L 332 312 L 318 352 L 82 352 Z" fill="#8B1E24" stroke="url(#suGoldGrad)" stroke-width="3" />
  <text x="200" y="336" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" letter-spacing="2.2">SANSKRITI UNIVERSITY</text>
  <text x="200" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12.5" fill="#8B1E24" letter-spacing="2.5">MATHURA • UTTAR PRADESH</text>
</svg>
